<style id="ls">
:root{color-scheme:dark;--paper:#0F1416;--panel:#171E21;--sunk:#111719;--line:#2A3639;
--ink:#E8EFF1;--muted:#7F969C;--go:#FF7A34;--go-ink:#1A0C04}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;
 -webkit-text-size-adjust:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:24px}
.lock{width:100%;max-width:400px}
.lock h1{font-family:"Barlow Condensed",Barlow,"Segoe UI",sans-serif;font-weight:700;
 font-size:30px;line-height:1.05;margin:0 0 6px;text-wrap:balance}
.lock .sub{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
 font-weight:600;margin-bottom:26px}
.lock label{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;
 letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lock input{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;
 padding:13px 14px;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-weight:700;
 font-size:19px;color:var(--ink);letter-spacing:.05em}
.lock input:focus{outline:none;border-color:var(--go)}
.lock button{width:100%;margin-top:11px;padding:13px;border:0;border-radius:6px;
 background:var(--go);color:var(--go-ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;
 font-size:18px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.lock button:disabled{opacity:.6;cursor:default}
.lock .er{margin-top:11px;color:#FF7A34;font-size:14px}
.lock .nb{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
 color:var(--muted);font-size:13px;line-height:1.5}
.lock a{color:var(--muted)}
</style>
